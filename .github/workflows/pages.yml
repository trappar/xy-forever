name: Deploy web app to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_NO_SYNC: '1'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_VERSION: 4.167.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
      - run: uv sync --locked --no-group native
      - run: pnpm install --frozen-lockfile
      - name: Get the pinned release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version=$(node -p "require('./web/src/install/release.json').version")
          mkdir -p web/public/release
          gh release download "v${release_version}" --repo "$GITHUB_REPOSITORY" --pattern os.ldr --output web/public/release/os.ldr
          uv run scripts/web_release.py --check
      - run: pnpm --filter xy-forever-web run build
      - name: Check the build with Cloudflare Pages
        run: |
          preview_log="$RUNNER_TEMP/pages-preview.log"
          npx --yes "wrangler@$WRANGLER_VERSION" pages dev web/dist --ip 127.0.0.1 --port 8788 > "$preview_log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --retry 60 --retry-connrefused --retry-delay 1 --retry-max-time 60 \
            --output /dev/null http://127.0.0.1:8788/; then
            cat "$preview_log"
            exit 1
          fi
          pnpm --filter xy-forever-web run smoke:pages
      - name: Publish the checked build to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" pages deploy web/dist --project-name=xy-forever --branch=main
