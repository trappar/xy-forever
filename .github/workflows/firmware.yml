# The product firmware (#303): builds os.ldr in the pinned build image (toolchains.json's "image", #321), as every
# firmware build on every OS does, so it is the same os.ldr a contributor builds from the same tree, and keeps it,
# with its SHA-256, as a workflow artifact for releases (#223) and canaries (#301). It needs no stock files: the build
# reads its stock facts from stock_facts.json, and the private folder here is an empty temporary one, so no Teenage
# Engineering bytes are read or uploaded.
#
# Cost: it runs only when the build's inputs change (turbo.json's //#firmware-build inputs, the image and its pins,
# this file), a newer push cancels a run in progress, and the job does nothing but the build.
#
# Canaries (#301): on main (a push, or a run started on main), a Linux job publishes the verified os.ldr as
# prerelease canary-<commit> (scripts/web_canary.py publish) unless the current canary has the same bytes, then starts
# the Pages deploy on main (pages.yml) so the site offers it; publishing nothing deploys nothing. It never runs for a
# pull request; it alone may write releases. A workflow_dispatch is the one event GITHUB_TOKEN may start a run with.
name: Firmware

on:
  pull_request:
    paths:
      - 'target/**'
      - 'native/**'
      - 'xy_forever/**'
      - 'third_party/**'
      - 'toolchains.json'
      - 'stock.json'
      - 'stock_facts.json'
      - 'uv.lock'
      - '.github/workflows/firmware.yml'
      - '.github/actions/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'target/**'
      - 'native/**'
      - 'xy_forever/**'
      - 'third_party/**'
      - 'toolchains.json'
      - 'stock.json'
      - 'stock_facts.json'
      - 'uv.lock'
      - '.github/workflows/firmware.yml'
      - '.github/actions/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Product os.ldr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read   # the build image (GHCR)
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      UV_NO_SYNC: "1"   # uv run keeps the sync below: no hosttest build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
      - run: uv sync --locked --no-group native
      - name: Log in to GHCR (the build image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the product in the build container (xyf-build verifies it before it finishes)
        env:
          XYF_PRIVATE: ${{ runner.temp }}/private   # empty: no stock files
        run: mkdir -p "$XYF_PRIVATE" && uv run -m xy_forever.container run xyf-build --xyf-product --out build/product
      - id: image
        name: os.ldr and its SHA-256
        run: |
          mkdir -p build/artifact
          cp build/product/candidate.ldr build/artifact/os.ldr
          cp build/product/manifest.json build/artifact/manifest.json
          (cd build/artifact && sha256sum os.ldr > os.ldr.sha256)
          sha=$(cut -d' ' -f1 build/artifact/os.ldr.sha256)
          echo "image=${sha:0:8}" >> "$GITHUB_OUTPUT"
          echo "Product os.ldr: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: os-ldr-${{ steps.image.outputs.image }}
          path: build/artifact/
          if-no-files-found: error

  canary:
    name: Canary prerelease
    needs: product
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the prerelease
      actions: write    # starts the Pages deploy
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
      - run: uv sync --locked --no-group native
      - uses: actions/download-artifact@v7
        with:
          name: os-ldr-${{ needs.product.outputs.image }}
          path: ${{ runner.temp }}/artifact
      - id: publish
        name: Publish the os.ldr as a canary unless the current canary has it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          said=$(uv run scripts/web_canary.py publish "$RUNNER_TEMP/artifact" --commit "$GITHUB_SHA")
          echo "$said" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$said" in published*) echo "published=true" >> "$GITHUB_OUTPUT" ;; esac
      - name: Deploy the site with the new canary
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
