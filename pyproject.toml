[project]
name = "xy-forever"
version = "0.1.0"
description = "XY Forever: a firmware and mod manager for the OP-XY (host tools, tests, build)"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
# Synced by default (`uv sync`): what the scripts beyond the core use.
dev = [
  "pyusb>=1.3.1",   # scripts/mtp_usb_probe.py and scripts/mtp_files_test.py (with Homebrew libusb)
]

[tool.uv]
package = false   # not an installable package yet (#234)
