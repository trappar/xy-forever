# Every tool a contributor needs, pinned (mise.lock holds the checksums): `mise trust && mise install`.
# The command catalogue: `mise tasks` lists them, `mise run <task> --help` shows a task's arguments.
min_version = "2026.11.0"

[settings]
lockfile = true

[tools]
python = "3.15.2"
uv = "0.13.9"
node = "26.13.1"
pnpm = "12.22.0"
gh = "2.105.0"
lefthook = "2.2.2"   # the git pre-commit hook (lefthook.yml); `mise run setup` installs it

[env]
# A project cannot hide the contributor's global mise config (~/.config/mise) from the mise run that
# reads this file (mise keeps that power for the user). Exported here, it keeps that config out of
# every mise call made inside a task or an activated shell; to keep it out everywhere, export it in
# the shell too. The tools above win over same-named global ones either way.
MISE_IGNORED_CONFIG_PATHS = "{{ env.HOME }}/.config/mise"
UV_PYTHON_DOWNLOADS = "never"   # uv uses the Python pinned above, never a download of its own
TURBO_TELEMETRY_DISABLED = "1"  # Turborepo (the firmware cache): no telemetry; turbo.json turns remote caching off

[tasks.setup]
description = "Set up tools, dependencies, private folder, toolchain, fixtures"
usage = '''
flag "--dry-run" help="print every action without doing it"
flag "--workspace <dir>" help="the folder that holds this clone, private/ and tools/"
flag "--toolchain-archive <zip>" help="open-xy's toolchain-1 release zip, already downloaded"
flag "--private <dir>" help="the private folder, when not ../private (recorded in xyf.local.json)"
flag "--toolchain <dir>" help="an installed Blackfin toolchain, when not ../tools/blackfin (recorded in xyf.local.json)"
'''
run = '''
python scripts/setup.py bootstrap {% if usage.dry_run %}--dry-run{% endif %} \
  {% if usage.workspace %}--workspace {{ usage.workspace | quote }}{% endif %} \
  {% if usage.toolchain_archive %}--toolchain-archive {{ usage.toolchain_archive | quote }}{% endif %} \
  {% if usage.private %}--private {{ usage.private | quote }}{% endif %} \
  {% if usage.toolchain %}--toolchain {{ usage.toolchain | quote }}{% endif %}
'''

[tasks.doctor]
description = "What is set up and which tests will skip"
run = "uv run scripts/setup.py doctor"

# The suite (pytest; tiers, budgets: tests/conftest.py; docs/operating/checks.md). Arguments pass
# through to pytest. A selection (a file, a node id, a folder, -k or -m) runs whatever its tier; otherwise
# `test` runs the fast tier. Every run uses one worker per core (-n auto).
[tasks.test]
description = "Fast tier of the suite (about 2 s; 4 s on a busy machine), or the selected tests, any tier"
usage = 'arg "[args]..." help="pytest arguments (files, node ids, -k EXPR or -m EXPR: any tier; -x, ...)" var=#true'
run = """{% set tier = "-m fast " %}{% for a in usage.args %}{% if a is ending_with(pat=".py") or "::" in a \
or a is starting_with(pat="tests") or a is starting_with(pat="-k") or a is starting_with(pat="-m") %}\
{% set_global tier = "" %}{% endif %}{% endfor %}\
uv run pytest -n auto --dist worksteal {{ tier }}{% for a in usage.args %}{{ a | quote }} {% endfor %}\
|| { s=$?; [ $s = 5 ] && echo 'no test matched: a bare word is a path to pytest; a test name: mise run test -k WORD' >&2; exit $s; }"""

[tasks.test-changed]
description = "Tests affected by your changes, every tier but the sweeps (testmon: Python, C++, scripts; Vitest: TypeScript)"
usage = 'arg "[args]..." help="pytest arguments" var=#true'
run = [
  'uv run pytest -n auto --dist worksteal -m "not sweep" --testmon-forceselect {% for a in usage.args %}{{ a | quote }} {% endfor %}',
  { task = "web-test-changed" },
]

[tasks.test-failed]
description = "Rerun the tests that failed last time (none failed: nothing runs)"
usage = 'arg "[args]..." help="pytest arguments" var=#true'
run = 'uv run pytest -n auto --dist worksteal --lf --lfnf none {% for a in usage.args %}{{ a | quote }} {% endfor %}|| test $? = 5'

[tasks.test-one]
description = "One test file, class or test, any tier, in one process"
usage = 'arg "<target>" help="e.g. tests/test_aes.py or tests/test_aes.py::NativeAesTests::test_x"'
run = 'uv run pytest -p no:xdist {{ usage.target | quote }}'

[tasks.test-watch]
description = "Rerun affected tests on every save (every tier but the sweeps)"
run = 'uv run ptw --now . -n auto --dist worksteal -m "not sweep" --testmon-forceselect'

[tasks.test-all]
description = "Every tier but the sweeps, the simulator core included (about 10 s; 35 s beside two other test-all runs); check and CI run it"
usage = 'arg "[args]..." help="pytest arguments" var=#true'
run = 'uv run pytest -n auto --dist worksteal -m "not sweep" {% for a in usage.args %}{{ a | quote }} {% endfor %}'

[tasks.test-sweeps]
description = "The long simulator sweeps (about 6 s; 15 s on a busy machine), in no shared run"
usage = 'arg "[args]..." help="pytest arguments" var=#true'
run = 'uv run pytest -n auto --dist worksteal -m sweep {% for a in usage.args %}{{ a | quote }} {% endfor %}'

[tasks.test-slow]
description = "Every tier but the sweeps, with the slowest tests listed"
usage = 'arg "[args]..." help="pytest arguments (-m fast: one tier)" var=#true'
run = 'uv run pytest -n auto --dist worksteal -m "not sweep" --durations=25 {% for a in usage.args %}{{ a | quote }} {% endfor %}'

[tasks.check]
description = "PR gate: build, verify (cached), lint, the TS suites when web/ or clients/ts changed, every tier but the sweeps (about 18 s, 25 s with the TS suites; 30-40 s on a busy machine)"
usage = 'arg "[args]..." help="check.py flags (--js, --force, --confirm [REF])" var=#true'
run = 'uv run --quiet scripts/check.py {% for a in usage.args %}{{ a | quote }} {% endfor %}'

[tasks.neutral]
description = "Same firmware as a ref? (reuses the check's product build)"
usage = 'arg "[ref]" help="the git ref to compare with" default="HEAD"'
run = 'uv run scripts/neutral.py {{ usage.ref | quote }}'

# Through Turborepo's local cache (scripts/firmware_cache.py, turbo.json); each prints one line.
[tasks.build]
description = "Product firmware build into build/product (cached: about 1 s; a fresh build 10-20 s)"
usage = 'flag "--force" help="build past the cache"'
quiet = true
run = 'uv run scripts/firmware_cache.py build {% if usage.force %}--force{% endif %}'

[tasks.verify]
description = "Product build, then --verify of it (cached: about 1 s; fresh 15-25 s)"
usage = 'flag "--force" help="build and verify past the cache"'
quiet = true
run = 'uv run scripts/firmware_cache.py verify {% if usage.force %}--force{% endif %}'

[tasks.firmware-cache-proof]
description = "Prove the firmware cache's hit and miss cases on a scratch worktree (under 2 min); after changing turbo.json or firmware_cache.py"
run = 'uv run scripts/firmware_cache_proof.py'

[tasks.sim]
description = "Device simulator: USB endpoint 127.0.0.1:7341, control port 7342"
run = "uv run -m xy_forever.sim --idle-wall"   # idle device time at the wall's pace: never in tests

[tasks.conformance]
description = "Protocol conformance cases against the simulator"
usage = 'arg "[address]" help="the simulator HOST:PORT,CONTROL (endpoint, control port)" default="127.0.0.1:7341,7342"'
run = 'uv run scripts/conformance.py --sim {{ usage.address | quote }}'

[tasks.protogen]
description = "Check the generated protocol files (--write: regenerate)"
usage = 'flag "--write" help="regenerate instead of checking"'
run = 'uv run scripts/protogen.py {% if usage.write %}{% else %}--check{% endif %}'

# Lint and format: ruff and vulture (Python), ESLint, Prettier and knip (web/, clients/ts, scripts/*.mjs; knip: unused
# files, exports and dependencies), clang-format (first-party C++; .clang-format-ignore keeps third_party/ and generated headers out). Configs: pyproject.toml [tool.ruff],
# eslint.config.mjs, .prettierrc.json, knip.json, .clang-format. The pre-commit hook (lefthook.yml) runs the same on staged files.
[tasks.lint]
description = "Lint and format checks, all languages (CI runs it; about 4 s; 7 s on a busy machine)"
depends = ["lint:python", "lint:ts", "lint:cpp"]

[tasks."lint:python"]
hide = true
run = ["uv run --no-sync ruff check --quiet", "uv run --no-sync ruff format --check --quiet", "uv run --no-sync vulture"]

[tasks."lint:ts"]
hide = true
run = ["pnpm exec eslint --max-warnings 0 .", "pnpm exec prettier --check --log-level warn web clients/ts 'scripts/*.mjs' eslint.config.mjs", "pnpm exec knip"]

[tasks."lint:cpp"]
hide = true
run = "git ls-files -z -co --exclude-standard -- '*.cpp' '*.hpp' '*.ipp' '*.h' | xargs -0 uv run --no-sync clang-format --dry-run -Werror"

[tasks.format]
description = "Format every file in place: ruff (and its import order), Prettier, clang-format"
run = [
  "uv run --no-sync ruff check --select I --fix --quiet",
  "uv run --no-sync ruff format --quiet",
  "pnpm exec prettier --write --log-level warn web clients/ts 'scripts/*.mjs' eslint.config.mjs",
  "git ls-files -z -co --exclude-standard -- '*.cpp' '*.hpp' '*.ipp' '*.h' | xargs -0 uv run --no-sync clang-format -i",
]

[tasks.lint-fix]
description = "Apply the linters' safe fixes (ruff, ESLint), then format"
run = ["uv run --no-sync ruff check --fix --quiet", "pnpm exec eslint --fix .", { task = "format" }]

[tasks.web]
description = "Web app dev server on 127.0.0.1:5173"
dir = "web"
run = "pnpm run dev"

[tasks.web-test]
description = "Web app and TypeScript client tests, then their type checks (about 7 s)"
run = [
  "uv run pnpm --filter xy-forever-client test",   # uv: syncs the project venv its simulator tests run
  "pnpm --filter xy-forever-web test",
  "pnpm --recursive --parallel run typecheck",
]

[tasks.web-test-changed]
description = "Web app and client tests affected by uncommitted changes, or by the files given (about 1 s if none)"
usage = 'arg "[files]..." help="files: the tests that import them (vitest related); none: uncommitted changes (--changed)" var=#true'
run = """{% set sel = "run --changed" %}{% if usage.files %}{% set sel = "related --run" %}{% for f in usage.files %}\
{% if f is starting_with(pat="/") %}{% set p = f %}{% else %}{% set p = config_root ~ "/" ~ f %}{% endif %}\
{% set_global sel = sel ~ " " ~ p | quote %}{% endfor %}{% endif %}\
cd clients/ts && uv run node_modules/.bin/vitest {{ sel }} --passWithNoTests && \
cd ../../web && node_modules/.bin/vitest {{ sel }} --passWithNoTests"""

[tasks.web-e2e]
description = "Web app e2e tests (Chrome, simulator): CI runs them when web/ changes"
dir = "web"
run = "uv run pnpm run test:e2e"   # uv: syncs the project venv the simulator specs run

[tasks.web-e2e-bounds]
description = "The e2e rig's hang bound: a nested run of a planted hung page must fail, named, in time (CI: when the rig changes)"
dir = "web"
run = "pnpm run test:e2e:bounds"

[tasks.plan]
description = "Next plan items and decisions waiting (--all: more)"
usage = 'arg "[args]..." help="plan.py arguments (--all)" var=#true'
run = 'uv run scripts/plan.py {% for a in usage.args %}{{ a | quote }} {% endfor %}'

[tasks.preview]
description = "Render the menu screens (../private/xy-forever/previews)"
run = "uv run tests/ui_preview.py"

[tasks.clean]
description = "Remove old private sessions and builds (dry run; --yes)"
usage = '''
flag "--keep <n>" help="sessions and builds to keep, newest first" default="10"
flag "--yes" help="delete; without it, only list what would go"
'''
run = 'uv run scripts/clean.py --keep {{ usage.keep }} {% if usage.yes %}--yes{% endif %}'

