# The web app's browser tests (`mise run web-e2e`: Playwright in the system Chrome), only when the web app or the
# client it uses changes; they are no part of the routine suite (#233). Without private files the simulator specs
# skip, so this runs the install page against its fake devices.
name: Web e2e

on:
  pull_request:
    paths: ['web/**', 'clients/ts/**', 'protocol/**', 'pnpm-lock.yaml', '.github/workflows/web-e2e.yml', '.github/actions/**']
  push:
    branches: [main]
    paths: ['web/**', 'clients/ts/**', 'protocol/**', 'pnpm-lock.yaml', '.github/workflows/web-e2e.yml', '.github/actions/**']

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Web app e2e (macOS, Chrome)
    runs-on: macos-15
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "1"   # uv run keeps the sync below: no hosttest build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/mise
      - run: uv sync --locked --no-group native   # no Python suite here: skip building hosttest/
      - run: pnpm install --frozen-lockfile
      - name: Install page and app in Chrome
        env:
          XYF_PRIVATE: ${{ runner.temp }}/private   # empty: the simulator specs skip
        run: mkdir -p "$XYF_PRIVATE" && mise run web-e2e
