# The merge check every pull request and main run. No Teenage Engineering bytes ever reach CI: the private folder is
# an empty temporary one, so the tests that need the stock os.ldr, the decrypted packages or a device report skip,
# and the firmware build modes (all of them read the stock os.ldr) are left to `mise run check` on a contributor's
# machine. The Blackfin toolchain is open-xy's public toolchain-1 release (scripts/setup.py's pinned download),
# cached, so the tests that need only the toolchain run here.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python suite (macOS, no private files)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.12
          cache: true
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Blackfin toolchain cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tools/blackfin
          key: blackfin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stock.json', 'toolchains.json') }}
      - name: Blackfin toolchain (open-xy's public release, checked against toolchains.json)
        env:
          XYF_TOOLCHAIN: ${{ runner.temp }}/tools/blackfin
        run: uv run scripts/setup.py toolchain
      - name: The suite, every tier but the sweeps (mise run test-all; CPU budgets enforced, wall time reported)
        env:
          XYF_PRIVATE: ${{ runner.temp }}/private   # empty: every test that needs private files skips
          XYF_TOOLCHAIN: ${{ runner.temp }}/tools/blackfin
        run: mkdir -p "$XYF_PRIVATE" && mise run test-all

  web:
    name: Lint, web app, client, protocol check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "1"   # uv run keeps the sync below: no hosttest build (no Python suite here)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.12
          cache: true
      - run: uv sync --locked --no-group native   # no Python suite here: skip building hosttest/
      - run: pnpm install --frozen-lockfile
      - name: Lint and format checks (ruff, ESLint, Prettier, clang-format)
        run: mise run lint
      - name: The generated protocol files match protocol/v1.json
        run: mise run protogen
      - name: Client tests, web tests, web type check
        run: mise run web-test
      - name: Web build
        run: pnpm --filter xy-forever-web run build
