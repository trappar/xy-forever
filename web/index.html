<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>XY Forever</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="mark">XY</span><span>Forever</span></div>
      <nav id="nav">
        <a href="/connect" data-page="connect">Connect</a>
        <a href="/install" data-page="install">Install</a>
        <a href="/device" data-page="device">Device</a>
        <a href="/mods" data-page="mods">Mods</a>
        <a href="/files" data-page="files">Files</a>
      </nav>
      <button type="button" id="bug-report">Bug report</button>
      <div class="link" id="link"><span class="dot"></span><span id="link-text">Not connected</span></div>
    </aside>
    <main>
      <div id="installed" class="notice installed" role="status" hidden>
        <span>XY Forever is installed, with your OP-XY's OS 1.2.1 as the firmware it starts. Add mods here.</span>
        <button type="button" id="installed-dismiss">Dismiss</button>
      </div>
      <div id="notice" class="notice" hidden></div>
      <section id="page-connect" class="page"></section>
      <section id="page-install" class="page" hidden></section>
      <section id="page-device" class="page" hidden></section>
      <section id="page-mods" class="page" hidden></section>
      <section id="page-files" class="page" hidden></section>
    </main>
  </div>
  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <dialog id="bug-report-dialog" aria-labelledby="bug-report-title">
    <h2 id="bug-report-title">Bug report preview</h2>
    <p>Review this JSON before sharing. Device details are from the last successful connection or refresh in this tab.</p>
    <pre class="mono" id="bug-report-preview" tabindex="0" aria-label="Bug report JSON"></pre>
    <form method="dialog" class="row">
      <button type="submit" autofocus>Close</button>
      <button type="button" class="primary" id="bug-report-download">Download JSON</button>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
