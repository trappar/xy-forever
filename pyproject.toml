[project]
name = "xy-forever"
version = "0.1.0"
description = "XY Forever: a firmware and mod manager for the OP-XY (host tools, tests, build)"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "pillow>=13.0.0",
    "pyelftools>=0.33",
    "pyserial>=3.5",
]

[dependency-groups]
# Synced by default (`uv sync`): what the scripts beyond the core use.
dev = [
  "pytest>=9.2.0",
  "pytest-testmon>=2.3.1",
  "pytest-timeout>=2.4.0",
  "pytest-watcher>=0.6.3",
  "pytest-xdist>=3.8.0",
  "pyusb>=1.3.1",   # scripts/mtp_usb_probe.py and scripts/mtp_files_test.py (with Homebrew libusb)
  "vulture>=2.16",
]

[project.scripts]
# `uv run xyf-host status` (or `uv run xyf_host.py status`: the root files are shims). scripts/ stays scripts:
# `uv run scripts/NAME.py`, which import the installed package.
xyf-host = "xy_forever.xyf_host:main"
xyf-build = "xy_forever.xyf_build:main"
xyf-package = "xy_forever.xyf_package:main"

[build-system]
# hatchling: pure Python. A compiled extension in the package itself (nanobind) would take scikit-build-core.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xy_forever"]

[tool.uv]
package = true    # `uv sync` installs xy_forever (editable) into .venv: no sys.path edits anywhere

[tool.vulture]
# `uv run vulture`: dead code. The names below are found by pytest and the device pass, not by calls.
paths = ["xy_forever", "scripts", "tests", "re"]
ignore_names = ["step_*", "test_*", "setUp*", "tearDown*", "pytest_*", "Test*", "log_message"]
min_confidence = 61

[tool.pytest]
# The suite: tests/ (unittest.TestCase classes, run by pytest). tests/conftest.py holds the tiers, the hard
# bounds (#230), the budgets and the C++ and script selection for --testmon. `mise tasks` lists the commands.
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["scripts"]              # tests import scripts/ modules (check, setup, protogen, ...); the package is installed
python_files = ["test_*.py"]
python_classes = ["Test"]             # unittest.TestCase subclasses only: a helper named Test* is no test
python_functions = []
addopts = ["-q", "-rfE", "--strict-markers"]
timeout = "60"                        # bounds.TEST_S: past it, HUNG (tests/xyf_bounds.py)
timeout_method = "thread"            # the signal method cannot interrupt a hung ctypes call
