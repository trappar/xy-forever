[project]
name = "xy-forever"
version = "0.1.0"
description = "XY Forever: a firmware and mod manager for the OP-XY (host tools, tests, build)"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "pillow>=13.0.0",
    "pyelftools>=0.33",
    "pyserial>=3.5",
    "pyusb>=1.3.1",   # MTP (xy_forever/mtp_read.py), with Homebrew's libusb
]

[dependency-groups]
# Synced by default (`uv sync`): what the scripts beyond the core use.
dev = [
  "pytest>=9.2.0",
  "pytest-testmon>=2.3.1",
  "pytest-timeout>=2.4.0",
  "pytest-watcher>=0.6.3",
  "pytest-xdist>=3.8.0",
  "vulture>=2.16",
  # Lint and format (mise run lint, format; the pre-commit hook): exact pins, so every machine formats alike.
  "ruff==0.17.6",
  "clang-format==23.1.5",
]
# The C++ built for the host for the tests (hosttest/: a nanobind extension and the doctest binary). Synced by
# default; a machine that runs no Python suite (CI's Linux job) can skip it: uv sync --no-group native.
native = ["xyf-hosttest", "scikit-build-core>=1.0", "nanobind>=3.0", "cmake>=3.20", "ninja>=1.11"]

[project.scripts]
# `uv run xyf-host status`. scripts/ stays scripts: `uv run scripts/NAME.py`, which import the installed package.
xyf-host = "xy_forever.xyf_host:main"
xyf-build = "xy_forever.xyf_build:main"
xyf-package = "xy_forever.xyf_package:main"

[build-system]
# hatchling: pure Python. A compiled extension in the package itself (nanobind) would take scikit-build-core.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xy_forever"]

[tool.uv]
package = true
default-groups = ["dev", "native"]
# hosttest builds in the project environment (its build requirements are in the native group): an isolated build
# would start each time in a new environment, and scikit-build-core then recompiles everything.
no-build-isolation-package = ["xyf-hosttest"]    # `uv sync` installs xy_forever (editable) into .venv: no sys.path edits anywhere

[tool.uv.sources]
xyf-hosttest = { path = "hosttest" }

[tool.vulture]
# `uv run vulture`: dead code. Its false positives: tests/vulture_whitelist.py. The names below are found by pytest
# and the device pass, not by calls; "[A-Z][a-z]*" is a test class (pytest finds unittest classes by type, not by name).
# usb_proto_ids.py is generated from protocol/v1.json: it lists the whole protocol, used or not.
paths = ["xy_forever", "scripts", "tests", "re", "hosttest"]
exclude = ["xy_forever/usb_proto_ids.py"]
ignore_names = ["step_*", "test_*", "setUp*", "tearDown*", "pytest_*", "Test*", "[A-Z][a-z]*", "log_message"]
min_confidence = 60

[tool.pytest]
# The suite: tests/ (unittest.TestCase classes, run by pytest). tests/conftest.py holds the tiers, the hard
# bounds (#230), the budgets and the C++ and script selection for --testmon. `mise tasks` lists the commands.
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["scripts"]              # tests import scripts/ modules (check, setup, protogen, ...); the package is installed
python_files = ["test_*.py"]
python_classes = ["Test"]             # unittest.TestCase subclasses only: a helper named Test* is no test
python_functions = []
addopts = ["-q", "-rfE", "--strict-markers"]
# pytest-timeout's timeout: bounds.TEST_S, set by tests/conftest.py. tests/xyf_bounds.py replaces its timer with its
# own thread (pytest_timeout_set_timer), so no timeout_method applies: a hung ctypes call cannot stop it.

[tool.ruff]
# Lint and format (`mise run lint`, `mise run format`; the pre-commit hook runs both on staged files).
line-length = 120
target-version = "py314"
extend-exclude = [
  "third_party",
  "xy_forever/usb_proto_ids.py",   # generated (scripts/protogen.py; `mise run protogen` compares it byte for byte)
]

[tool.ruff.per-file-target-version]
# The modules of the developer package (pypi/pyproject.toml [tool.xyf] modules; tests/test_xyf_dist.py keeps the lists
# equal): they run on Python 3.11, Open-XY's minimum, so they are linted and formatted as 3.11.
"xy_forever/__init__.py" = "py311"
"xy_forever/bounds.py" = "py311"
"xy_forever/build_formats.py" = "py311"
"xy_forever/depth.py" = "py311"
"xy_forever/device_client.py" = "py311"
"xy_forever/device_lock.py" = "py311"
"xy_forever/host_trust.py" = "py311"
"xy_forever/host_write.py" = "py311"
"xy_forever/ldr.py" = "py311"
"xy_forever/moddev.py" = "py311"
"xy_forever/modconfig.py" = "py311"
"xy_forever/modkit.py" = "py311"
"xy_forever/modkit_read.py" = "py311"
"xy_forever/modsend.py" = "py311"
"xy_forever/modsend_local.py" = "py311"
"xy_forever/modstore.py" = "py311"
"xy_forever/native_json.py" = "py311"
"xy_forever/no_device.py" = "py311"
"xy_forever/package_records.py" = "py311"
"xy_forever/package_store.py" = "py311"
"xy_forever/paths.py" = "py311"
"xy_forever/startup_ready.py" = "py311"
"xy_forever/transport.py" = "py311"
"xy_forever/usb_proto.py" = "py311"
"xy_forever/usb_proto_ids.py" = "py311"
"xy_forever/xyf.py" = "py311"
"xy_forever/xyf_entry.py" = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = [
  "E501",     # long lines: the formatter wraps code; the rest are strings and comments
  "E731",     # a lambda bound to a name
  "E741",     # names like l and O
  "UP031",    # printf-style % formatting: the repository's style
  "C408",     # dict(a=1) calls: the repository's style
  "RUF005",   # [*a, b] over a + [b]
  "B904",     # raise ... from inside except: tracebacks only
  "B023",     # a closure using its loop's variable: here each is called within its own iteration
  "B905",     # zip() without strict=
  "RUF012",   # ClassVar on mutable class attributes
  "RUF059",   # unused names in tuple unpacking: they document the tuple's shape
]

[tool.ruff.format]
quote-style = "single"   # the repository's style
