# The merge check every pull request runs, on Linux (#229: macOS minutes bill at ten times Linux's). No Teenage
# Engineering bytes ever reach CI: the private folder is an empty temporary one, so the tests that need the stock
# os.ldr, the decrypted packages or a device report skip. firmware.yml builds the product firmware (on macOS);
# `mise run check` on a contributor's machine builds it with the stock files. open-xy publishes no Linux Blackfin
# toolchain, so the tests that need one (the freestanding and stack checks) skip here too: `mise run check` runs them, and a
# manual run with `macos` checked runs the suite on macOS with open-xy's public toolchain-1 release.
#
# Cost: a job bills whole minutes, so the checks are one job whose steps run by what changed (a paths-filter step,
# no job of its own): a docs-only change (docs/, Markdown) runs lint, the doc budgets and the leak scan; the web
# app, client and protocol steps run when those change; the Python suite when anything but docs does. The browser
# tests are their own workflow (e2e.yml), on their own paths. A push cancels the PR's run in progress. A merge to
# main runs only the Python suite: it checks the merged result and fills the caches every pull request restores
# from (a pull request's caches are its own). The host C++ build goes through ccache, so a run recompiles only what
# changed (85 s to 18 s). Measured and left out: a uv or pnpm cache (each restore costs what the download takes,
# 2-3 s).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      macos:
        description: Run the Python suite on macOS (with the Blackfin toolchain), at ten times the cost
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, web app, client, Python suite
    runs-on: ${{ inputs.macos && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # the paths-filter step lists the pull request's files
    env:
      CC: clang   # the host C++ build (hosttest/) with clang, as on a Mac, through ccache
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      UV_NO_SYNC: "1"   # uv run keeps the sync below (without hosttest when no Python suite runs)
      PR: ${{ github.event_name == 'pull_request' }}
      CODE: ${{ github.event_name != 'pull_request' }}   # on a pull request: the paths-filter step's
      WEB: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: code
        if: env.PR == 'true'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every   # a file outside docs/ that is not Markdown
          filters: |
            code: ['**', '!docs/**', '!**/*.md']
      - id: web
        if: env.PR == 'true'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web: ['web/**', 'clients/ts/**', 'protocol/**', 'package.json', 'pnpm-lock.yaml', '.github/**']
      - name: What runs (CODE - the Python suite; WEB - the web app and client)
        if: env.PR == 'true'
        run: |
          echo "CODE=${{ steps.code.outputs.code }}" >> "$GITHUB_ENV"
          echo "WEB=${{ steps.web.outputs.web }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/mise
      - name: ccache (the host C++ build's objects)
        if: env.CODE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2.26
        with:
          key: hosttest-${{ runner.os }}-${{ runner.arch }}
          evict-old-files: job   # keep only what this build used
      - run: uv sync --locked ${{ env.CODE != 'true' && '--no-group native' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Lint and format checks (ruff, vulture, ESLint, Prettier, knip, clang-format)
        if: env.PR == 'true'
        run: mise run lint
      - name: Doc budgets, links and the leak scan (in the suite too; here when it does not run)
        if: env.PR == 'true' && env.CODE != 'true'
        run: uv run python -m unittest tests/test_docs_budget.py tests/test_no_leaks.py
      - name: The generated protocol files match protocol/v1.json
        if: env.PR == 'true' && env.CODE == 'true'
        run: mise run protogen
      - name: Client tests, web tests, web type check
        if: env.WEB == 'true'
        run: mise run web-test
      - name: Web build
        if: env.WEB == 'true'
        run: pnpm --filter xy-forever-web run build
      - name: Blackfin toolchain cache
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tools/blackfin
          key: blackfin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stock.json', 'toolchains.json') }}
      - name: Blackfin toolchain (open-xy's public release, checked against toolchains.json)
        if: runner.os == 'macOS'
        env:
          XYF_TOOLCHAIN: ${{ runner.temp }}/tools/blackfin
        run: uv run scripts/setup.py toolchain
      - name: The suite, every tier but the sweeps (mise run test-all; CPU budgets enforced, wall time reported)
        if: env.CODE == 'true'
        env:
          XYF_PRIVATE: ${{ runner.temp }}/private   # empty: every test that needs private files skips
          XYF_TOOLCHAIN: ${{ runner.temp }}/tools/blackfin
        run: mkdir -p "$XYF_PRIVATE" && mise run test-all
